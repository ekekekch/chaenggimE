<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챙김이 - 학생용</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-50 text-gray-900">
    <!-- 로그인 섹션 (세션 정보 없으면 표시) -->
    <div id="login-modal" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm space-y-4">
            <h1 class="text-2xl font-black text-center mb-6">우리 반 챙김이</h1>
            <input type="text" id="access-code" placeholder="인증 코드(1234)" class="w-full p-4 border rounded-2xl outline-none focus:ring-2 ring-emerald-500">
            <input type="text" id="user-name" placeholder="본인 이름" class="w-full p-4 border rounded-2xl outline-none focus:ring-2 ring-emerald-500">
            <button onclick="login()" class="w-full bg-emerald-500 text-white p-4 rounded-2xl font-black text-lg">입장하기</button>
        </div>
    </div>

    <!-- 메인 앱 섹션 -->
    <div id="app" class="max-w-lg mx-auto pb-20 hidden">
        <nav class="sticky top-0 bg-white border-b px-6 py-5 flex justify-between items-center z-50">
            <h1 class="font-black text-lg"><span id="display-name" class="text-emerald-600"></span> 학생</h1>
            <button onclick="logout()" class="text-[10px] text-slate-400 font-bold">로그아웃</button>
        </nav>

        <div class="px-5 py-6 space-y-8">
            <section>
                <h2 class="font-black text-lg mb-4 flex items-center gap-2 px-1"><i data-lucide="target" class="text-emerald-500 w-5"></i> 오늘의 미션</h2>
                <div id="quest-list" class="space-y-3">
                    <div class="text-center py-10 text-slate-400 font-bold">미션을 불러오는 중...</div>
                </div>
            </section>
        </div>
    </div>

    <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="verifyPhoto(event)">

    <script>
        // Firebase 설정 (교사용과 반드시 동일해야 함)
        const firebaseConfig = { databaseURL: "https://chaenggime-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myName = sessionStorage.getItem("studentName");
        let currentQuestId = "";

        // 페이지 로드 시 로그인 상태 확인
        window.onload = () => {
            if (myName) {
                showApp();
            } else {
                document.getElementById('login-modal').classList.remove('hidden');
            }
        };

        function login() {
            const code = document.getElementById('access-code').value;
            const nameInput = document.getElementById('user-name').value.trim();
            
            if (code !== "1234") return alert("코드가 틀렸습니다.");
            if (!nameInput) return alert("이름을 입력하세요.");

            sessionStorage.setItem("studentName", nameInput); // 새로고침해도 유지되게 저장
            myName = nameInput;
            
            // 실시간 입장 현황 기록
            db.ref('presence/' + myName).set({ status: "online", last_seen: Date.now() });
            
            showApp();
        }

        function showApp() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('display-name').innerText = myName;
            loadQuests();
        }

        function loadQuests() {
            db.ref('quests').on('value', (snap) => {
                const quests = snap.val() || {};
                const list = document.getElementById('quest-list');
                const array = Object.keys(quests).reverse();

                if (array.length === 0) {
                    list.innerHTML = `<div class="text-center py-10 opacity-30">부여된 퀘스트가 없습니다.</div>`;
                    return;
                }

                list.innerHTML = array.map(id => {
                    const q = quests[id];
                    const isDone = q.verified_students && q.verified_students[myName];
                    return `
                    <div class="bg-white p-4 rounded-2xl border flex justify-between items-center shadow-sm">
                        <div>
                            <p class="font-black">${q.item_name}</p>
                            <p class="text-[10px] text-slate-400">마감: ${q.deadline}</p>
                        </div>
                        ${isDone ? `<span class="text-emerald-500 font-black text-xs">인증 완료</span>` 
                        : `<button onclick="openCam('${id}')" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-black">촬영</button>`}
                    </div>`;
                }).join('');
                lucide.createIcons();
            });
        }

        function openCam(id) { currentQuestId = id; document.getElementById('camera-input').click(); }

        function verifyPhoto(e) {
            if (!e.target.files[0]) return;
            // 인증 데이터베이스 반영
            db.ref(`quests/${currentQuestId}/verified_students/${myName}`).set(new Date().toLocaleString());
            alert("인증되었습니다!");
        }

        function logout() { sessionStorage.clear(); location.reload(); }
    </script>
</body>
</html>
