<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챙김이 - 학생용</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-50">
    <div id="login-modal" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm space-y-4 text-center">
            <div class="w-20 h-20 bg-emerald-500 rounded-3xl mx-auto mb-4 flex items-center justify-center text-white text-4xl font-black">챙</div>
            <h1 class="text-2xl font-black mb-6">우리 반 챙김이</h1>
            <input type="text" id="user-name" placeholder="이름 입력 (예: 김큐티)" class="w-full p-4 border-2 rounded-2xl focus:border-emerald-500 outline-none font-bold text-center">
            <button onclick="login()" class="w-full bg-emerald-500 text-white p-4 rounded-2xl font-black text-lg">입장하기</button>
        </div>
    </div>

    <div id="app" class="max-w-lg mx-auto p-5 hidden">
        <header class="py-6 flex justify-between items-center">
            <h1 class="font-black text-xl text-emerald-600" id="display-name"></h1>
            <button onclick="localStorage.clear(); location.reload();" class="text-xs text-slate-400 border px-2 py-1 rounded">로그아웃</button>
        </header>

        <div class="space-y-4">
            <h2 class="font-black text-lg">오늘의 퀘스트</h2>
            <div id="quest-list" class="space-y-3"></div>
        </div>
    </div>

    <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">

    <script>
        // ⚠️ 주의: 아래 주소를 선생님의 Firebase Realtime Database 주소로 반드시 바꾸세요!
        const firebaseConfig = { databaseURL: "https://chaenggime-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myName = localStorage.getItem("studentName");
        let activeId = null;

        window.onload = () => { if(myName) startApp(); };

        function login() {
            const name = document.getElementById('user-name').value.trim();
            if(!name) return alert("이름을 입력하세요.");
            localStorage.setItem("studentName", name);
            myName = name;
            startApp();
        }

        function startApp() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('display-name').innerText = "👋 " + myName;
            
            // 퀘스트 실시간 감시
            db.ref('quests').on('value', snap => {
                const data = snap.val() || {};
                const list = document.getElementById('quest-list');
                const myItems = Object.keys(data).filter(id => data[id].target_list && data[id].target_list.includes(myName));

                list.innerHTML = myItems.reverse().map(id => {
                    const q = data[id];
                    const isDone = q.verified_students && q.verified_students[myName];
                    return `
                    <div class="bg-white p-5 rounded-2xl border flex justify-between items-center shadow-sm">
                        <div>
                            <p class="font-black ${isDone ? 'text-slate-300 line-through' : 'text-slate-800'}">${q.item_name}</p>
                            <p class="text-[10px] text-slate-400 font-bold">마감: ${q.deadline}</p>
                        </div>
                        ${isDone ? '<span class="text-emerald-500 font-black text-xs">완료됨 ✅</span>' : 
                        `<button onclick="upload('${id}')" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-black">인증하기</button>`}
                    </div>`;
                }).join('') || '<p class="text-center py-10 text-slate-400 font-bold">도착한 퀘스트가 없습니다.</p>';
            });
        }

        function upload(id) {
            activeId = id;
            document.getElementById('camera-input').click();
        }

        document.getElementById('camera-input').onchange = (e) => {
            if(!e.target.files[0]) return;
            const time = new Date().toLocaleString();
            db.ref(`quests/${activeId}/verified_students/${myName}`).set(time)
              .then(() => alert("인증이 완료되었습니다!"))
              .catch(err => alert("에러 발생: " + err.message));
        };
    </script>
</body>
</html>
