<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챙김이 - 학생용</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-50 text-gray-900">
    <!-- 로그인/입장 섹션 -->
    <div id="login-modal" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm space-y-4">
            <h1 class="text-3xl font-black text-center mb-8 text-emerald-600">우리 반 챙김이</h1>
            <input type="password" id="access-code" placeholder="인증 코드를 입력하세요" class="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-emerald-500 rounded-2xl outline-none transition-all font-bold">
            <input type="text" id="user-name" placeholder="이름을 입력하세요" class="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-emerald-500 rounded-2xl outline-none transition-all font-bold">
            <button onclick="login()" class="w-full bg-emerald-500 text-white p-4 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">입장하기</button>
        </div>
    </div>

    <!-- 메인 앱 -->
    <div id="app" class="max-w-lg mx-auto pb-24 hidden">
        <nav class="sticky top-0 bg-white/80 backdrop-blur-md border-b px-6 py-5 flex justify-between items-center z-50">
            <h1 class="font-black text-xl text-emerald-600" id="display-name"></h1>
            <div class="px-4 py-1.5 bg-orange-100 text-orange-600 rounded-full text-xs font-black" id="streak-info">0일 연속 🔥</div>
        </nav>

        <div class="px-5 py-6 space-y-8">
            <!-- 퀘스트 섹션 -->
            <section class="space-y-4">
                <h2 class="font-black text-lg flex items-center gap-2"><i data-lucide="layout-list" class="text-emerald-500"></i> 오늘의 퀘스트</h2>
                <div id="quest-list" class="space-y-3"></div>
            </section>

            <!-- 주간 기록 현황 및 완료율 -->
            <section class="bg-slate-900 p-6 rounded-[32px] text-white shadow-xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="font-black text-sm opacity-80">이번 주 기록 현황</h2>
                    <span id="weekly-rate" class="text-emerald-400 font-black text-xl">0%</span>
                </div>
                <div class="grid grid-cols-7 gap-2" id="weekly-status-grid">
                    <!-- 날짜와 상태가 자바스크립트로 생성됨 -->
                </div>
                <div class="mt-6 pt-4 border-t border-slate-800 text-[10px] text-slate-400 font-bold flex justify-between">
                    <span>* 오늘 날짜 기준 7일간의 기록입니다.</span>
                    <span id="completion-text">0/0 완료</span>
                </div>
            </section>
        </div>
    </div>

    <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="completeQuest(event)">

    <script>
        const firebaseConfig = { databaseURL: "https://chaenggime-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myName = localStorage.getItem("studentName");
        let activeQuestId = null;

        window.onload = () => { if(myName) initApp(); };

        function login() {
            const code = document.getElementById('access-code').value;
            const name = document.getElementById('user-name').value.trim();
            if(code !== "1234") return alert("인증코드가 올바르지 않습니다.");
            if(!name) return alert("이름을 입력하세요.");
            localStorage.setItem("studentName", name);
            myName = name;
            initApp();
        }

        function initApp() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('display-name').innerText = myName + " 학생";
            
            // 실시간 입장 현황 업데이트 로직 (문제 5 해결)
            const presenceRef = db.ref(`presence/${myName}`);
            presenceRef.set({ status: "online", last_seen: Date.now() });
            presenceRef.onDisconnect().remove(); // 브라우저 종료 시 자동 삭제

            loadQuestsAndStats();
            lucide.createIcons();
        }

        function loadQuestsAndStats() {
            db.ref('quests').on('value', (snap) => {
                const quests = snap.val() || {};
                const keys = Object.keys(quests);
                
                // 1. 오늘의 퀘스트 렌더링 (지정된 학생인 경우만)
                const questList = document.getElementById('quest-list');
                const myQuests = keys.filter(id => quests[id].target === 'all' || (quests[id].target_list && quests[id].target_list.includes(myName)));
                
                questList.innerHTML = myQuests.reverse().map(id => {
                    const q = quests[id];
                    const done = q.verified_students && q.verified_students[myName];
                    return `
                    <div class="bg-white p-5 rounded-2xl border-2 ${done ? 'border-emerald-100' : 'border-transparent'} flex justify-between items-center shadow-sm">
                        <div>
                            <p class="font-black ${done ? 'text-slate-400 line-through' : 'text-slate-800'}">${q.item_name}</p>
                            <p class="text-[10px] font-bold text-slate-400">마감: ${q.deadline}</p>
                        </div>
                        ${done ? '<i data-lucide="check-circle" class="text-emerald-500"></i>' : 
                        `<button onclick="openCam('${id}')" class="bg-slate-900 text-white px-5 py-2 rounded-xl text-xs font-black">인증</button>`}
                    </div>`;
                }).join('') || '<p class="text-center py-10 text-slate-400 font-bold">참여할 퀘스트가 없습니다.</p>';

                // 2. 주간 통계 계산 (문제 3, 4 해결)
                renderWeeklyStats(myQuests, quests);
                lucide.createIcons();
            });
        }

        function renderWeeklyStats(myQuests, allQuestsData) {
            const days = ['일','월','화','수','목','금','토'];
            const today = new Date();
            const grid = document.getElementById('weekly-status-grid');
            grid.innerHTML = '';

            let completedCount = 0;
            const last7Days = [];

            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(today.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                
                // 해당 날짜에 완료한 퀘스트가 있는지 확인
                const isDayDone = myQuests.some(id => {
                    const v = allQuestsData[id].verified_students;
                    return v && v[myName] && v[myName].includes(dateStr);
                });

                if(isDayDone) completedCount++;

                grid.innerHTML += `
                <div class="text-center">
                    <div class="w-full aspect-square rounded-xl mb-2 flex items-center justify-center border-2 
                        ${isDayDone ? 'bg-emerald-500 border-emerald-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-600'} transition-all">
                        <i data-lucide="${isDayDone ? 'check' : 'minus'}" class="w-4"></i>
                    </div>
                    <span class="text-[10px] font-bold opacity-50">${days[d.getDay()]}</span>
                </div>`;
            }

            const rate = myQuests.length > 0 ? Math.round((completedCount / myQuests.length) * 100) : 0;
            document.getElementById('weekly-rate').innerText = rate + "%";
            document.getElementById('completion-text').innerText = `${completedCount}/${myQuests.length} 완료`;
        }

        function openCam(id) { activeQuestId = id; document.getElementById('camera-input').click(); }

        function completeQuest(e) {
            if(!e.target.files[0]) return;
            const now = new Date();
            const timeStr = now.toLocaleString();
            db.ref(`quests/${activeQuestId}/verified_students/${myName}`).set(timeStr);
            alert("인증 완료! 참 잘했어요 👏");
        }
    </script>
</body>
</html>
