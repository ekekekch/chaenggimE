<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챙김이 - 교사용</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-2xl mx-auto space-y-6 pb-24">
        <header><h1 class="text-3xl font-black italic text-blue-600">Quest Controller</h1></header>

        <!-- 퀘스트 발송 섹션 -->
        <section class="bg-white p-8 rounded-[40px] border shadow-sm space-y-6">
            <h2 class="font-black text-xl text-blue-600">🚀 퀘스트 부여</h2>
            <div class="grid grid-cols-1 gap-4">
                <input type="text" id="item-name" placeholder="미션 이름 (예: 일기장 가져오기)" class="p-4 bg-slate-50 rounded-2xl outline-none font-bold focus:ring-2 ring-blue-500">
                <input type="datetime-local" id="deadline" class="p-4 bg-slate-50 rounded-2xl outline-none font-bold">
            </div>
            
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-black text-slate-400 uppercase">대상 학생 선택 (입장한 학생만 표시됨)</span>
                    <button onclick="toggleAll()" class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full">전체 선택/해제</button>
                </div>
                <div id="student-selector" class="flex flex-wrap gap-2">
                    <p class="text-[10px] text-slate-300 font-bold py-2">현재 접속 중인 학생이 없습니다.</p>
                </div>
            </div>
            <button onclick="sendQuest()" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black text-lg shadow-xl active:scale-95 transition-all">퀘스트 발송</button>
        </section>

        <!-- 현황 요약 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-[32px] border flex flex-col items-center">
                <h3 class="text-xs font-black text-slate-400 mb-4">전체 지참 완료율</h3>
                <div class="relative w-32 h-32">
                    <canvas id="mainChart"></canvas>
                    <div id="chart-label" class="absolute inset-0 flex items-center justify-center font-black text-blue-600 text-xl">0%</div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-[32px] border">
                <h3 class="text-xs font-black text-slate-400 mb-4">우리반 학생들</h3>
                <div id="presence-list" class="flex flex-wrap gap-2"></div>
            </div>
        </div>

        <section class="space-y-4">
            <h2 class="font-black text-xl px-2">부여한 퀘스트 현황</h2>
            <div id="quest-dashboard" class="space-y-4"></div>
        </section>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://chaenggime-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentOnlineStudents = [];
        let selected = [];
        let chart;

        window.onload = () => {
            const ctx = document.getElementById('mainChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: [0, 100], backgroundColor: ['#2563eb', '#f1f5f9'], borderWidth: 0 }] },
                options: { cutout: '80%', events: [] }
            });
            initRealtime();
        };

        function toggleStudent(name) {
            const idx = selected.indexOf(name);
            const btn = document.getElementById(`btn-${name}`);
            if(idx > -1) {
                selected.splice(idx, 1);
                btn.className = "px-4 py-2 rounded-xl border-2 border-slate-100 text-[10px] font-black text-slate-400";
            } else {
                selected.push(name);
                btn.className = "px-4 py-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-blue-600 font-black";
            }
        }

        function toggleAll() {
            if(selected.length === currentOnlineStudents.length && currentOnlineStudents.length > 0) {
                selected = [];
            } else {
                selected = [...currentOnlineStudents];
            }
            updateSelectorButtons();
        }

        function updateSelectorButtons() {
            const container = document.getElementById('student-selector');
            if(currentOnlineStudents.length === 0) {
                container.innerHTML = '<p class="text-[10px] text-slate-300 font-bold py-2">현재 접속 중인 학생이 없습니다.</p>';
                return;
            }
            container.innerHTML = currentOnlineStudents.map(s => {
                const isSel = selected.includes(s);
                return `<button id="btn-${s}" onclick="toggleStudent('${s}')" class="px-4 py-2 rounded-xl border-2 ${isSel ? 'border-blue-500 bg-blue-50 text-blue-600' : 'border-slate-100 text-slate-400'} text-[10px] font-black transition-all">${s}</button>`;
            }).join('');
        }

        function sendQuest() {
            const name = document.getElementById('item-name').value;
            const dl = document.getElementById('deadline').value;
            if(!name || !dl || selected.length === 0) return alert("내용, 마감일, 대상을 확인하세요.");

            db.ref('quests').push({
                item_name: name,
                deadline: dl.replace('T', ' '),
                target: 'selected',
                target_list: selected,
                verified_students: {}
            }).then(() => {
                alert("퀘스트 발송 성공!");
                document.getElementById('item-name').value = '';
                selected = [];
                updateSelectorButtons();
            });
        }

        function initRealtime() {
            // 접속자 기반으로 버튼 동적 생성
            db.ref('presence').on('value', snap => {
                const data = snap.val() || {};
                currentOnlineStudents = Object.keys(data);
                
                // 선택된 학생 중 나간 학생 제거
                selected = selected.filter(s => currentOnlineStudents.includes(s));
                
                updateSelectorButtons();
                
                document.getElementById('presence-list').innerHTML = currentOnlineStudents.map(n => 
                    `<span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-[10px] font-bold border border-blue-100">● ${n}</span>`
                ).join('') || '<p class="text-[10px] text-slate-300">접속 중인 학생 없음</p>';
            });

            db.ref('quests').on('value', snap => {
                const quests = snap.val() || {};
                const keys = Object.keys(quests).reverse();
                let tDone = 0, tTotal = 0;

                document.getElementById('quest-dashboard').innerHTML = keys.map(id => {
                    const q = quests[id];
                    const targets = q.target_list || [];
                    const dones = Object.keys(q.verified_students || {});
                    tDone += dones.length;
                    tTotal += targets.length;

                    return `
                    <div class="bg-white p-6 rounded-[32px] border shadow-sm">
                        <div class="flex justify-between items-center mb-4">
                            <h4 class="font-black text-lg">${q.item_name}</h4>
                            <span class="text-xs font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full">${dones.length}/${targets.length}</span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${targets.map(s => `<div class="px-3 py-1.5 rounded-xl text-[10px] font-bold border ${dones.includes(s) ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-slate-50 text-slate-300 border-slate-100'}">${s}</div>`).join('')}
                        </div>
                    </div>`;
                }).join('');

                const percent = tTotal > 0 ? Math.round((tDone / tTotal) * 100) : 0;
                document.getElementById('chart-label').innerText = percent + "%";
                chart.data.datasets[0].data = [percent, 100 - percent];
                chart.update();
            });
        }
    </script>
</body>
</html>
