<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>챙김이 - 교사용</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 p-6 sm:p-10 text-sm">
    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-8">
        
        <!-- 왼쪽: 미션 전송 패널 -->
        <div class="md:col-span-4 space-y-6">
            <div class="bg-white p-8 rounded-[32px] shadow-sm border border-slate-200">
                <h2 class="text-xl font-black mb-6 flex items-center gap-2"><span class="text-blue-600">🚀</span> 미션 발송</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 mb-1 uppercase tracking-wider">인증 준비물</label>
                        <input type="text" id="item-name" placeholder="예: 지우개, 각도기" class="w-full bg-slate-50 border-0 p-4 rounded-2xl outline-none focus:ring-2 ring-blue-500 transition-all font-bold">
                    </div>
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 mb-1 uppercase tracking-wider">인증 마감 일자</label>
                        <input type="datetime-local" id="deadline" class="w-full bg-slate-50 border-0 p-4 rounded-2xl outline-none focus:ring-2 ring-blue-500 font-bold">
                    </div>
                    <button onclick="sendQuest()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black text-lg shadow-xl shadow-blue-100 active:scale-95 transition-all">전송하기</button>
                </div>
            </div>

            <!-- 현황 휠 (차트) -->
            <div class="bg-white p-6 rounded-[32px] shadow-sm text-center">
                <h3 class="font-black mb-4">전체 지참 현황</h3>
                <canvas id="statusChart" class="mx-auto" width="200" height="200"></canvas>
            </div>
        </div>

        <!-- 오른쪽: 실시간 대시보드 -->
        <div class="md:col-span-8 space-y-6">
            <!-- 집중 케어 명단 -->
            <div class="bg-red-50 p-6 rounded-[32px] border-2 border-red-100">
                <h3 class="text-red-600 font-black flex items-center gap-2 mb-4 italic italic"><span class="not-italic">🚨</span> 집중 케어 명단 (2회 이상 누락)</h3>
                <div id="care-list" class="flex flex-wrap gap-2 text-xs font-bold text-red-500">
                    정보를 분석 중입니다...
                </div>
            </div>

            <!-- 준비물별 발송 현황 -->
            <div id="item-dashboard" class="space-y-4">
                <h3 class="font-black text-xl px-2">물건별 발송 현황</h3>
                <!-- 여기에 준비물 카드들이 동적으로 추가됩니다 -->
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://chaenggime-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 임시 학생 명단 (실제는 DB에서 관리 가능)
        const students = ["김철수", "이영희", "박지민", "최유나", "정재현", "송미소"];

        function sendQuest() {
            const item = document.getElementById('item-name').value;
            const deadline = document.getElementById('deadline').value;
            if(!item || !deadline) return alert("정보를 모두 입력하세요.");
            
            db.ref('quests').push({
                item_name: item,
                deadline: deadline,
                created_at: new Date().toISOString(),
                verified_students: {}
            });
            alert("학생들에게 알림이 전송되었습니다.");
        }

        db.ref('quests').on('value', (snap) => {
            const data = snap.val() || {};
            renderDashboard(data);
            updateCareList(data);
            updateChart(data);
        });

        function renderDashboard(quests) {
            const container = document.getElementById('item-dashboard');
            container.innerHTML = Object.keys(quests).map(id => {
                const q = quests[id];
                const verified = q.verified_students || {};
                const done = students.filter(s => verified[s]);
                const undone = students.filter(s => !verified[s]);

                return `
                <div class="bg-white p-6 rounded-[32px] shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h4 class="text-lg font-black">${q.item_name}</h4>
                            <p class="text-xs font-bold text-slate-400">마감: ${q.deadline}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-2xl font-black text-blue-600">${done.length}</span>
                            <span class="text-slate-300 font-bold"> / ${students.length}</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-[10px] font-black text-emerald-500 uppercase mb-2">완료 학생</p>
                            <div class="space-y-1">${done.map(s => `<div class='bg-emerald-50 text-emerald-700 px-3 py-2 rounded-xl font-bold text-[11px]'>${s}</div>`).join('')}</div>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-red-400 uppercase mb-2">미완료 학생</p>
                            <div class="space-y-1">${undone.map(s => `<div class='bg-slate-50 text-slate-400 px-3 py-2 rounded-xl font-bold text-[11px] flex justify-between'>${s} <button onclick="manualDone('${id}', '${s}')" class="hover:text-blue-500">✍️</button></div>`).join('')}</div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function updateCareList(quests) {
            const failCount = {};
            Object.values(quests).forEach(q => {
                const verified = q.verified_students || {};
                students.forEach(s => {
                    if(!verified[s]) failCount[s] = (failCount[s] || 0) + 1;
                });
            });
            const targets = Object.keys(failCount).filter(s => failCount[s] >= 2);
            document.getElementById('care-list').innerHTML = targets.length > 0 
                ? targets.map(t => `<span class="bg-white px-3 py-1 rounded-full border border-red-200 shadow-sm">${t} (${failCount[t]}회 누락)</span>`).join('')
                : "현재 집중 케어 대상이 없습니다.";
        }

        function manualDone(qId, sName) {
            if(confirm(`${sName} 학생을 수동 완료 처리할까요?`)) {
                db.ref(`quests/${qId}/verified_students/${sName}`).set("Manual: " + new Date().toLocaleString());
            }
        }

        // 차트 초기화 및 업데이트 로직 (생략)
    </script>
</body>
</html>
