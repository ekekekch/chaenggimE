<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챙김이 - 교사용</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-2xl mx-auto space-y-6 pb-24">
        <header class="flex justify-between items-end">
            <div>
                <p class="text-blue-600 font-black text-xs uppercase tracking-widest">Dashboard</p>
                <h1 class="text-3xl font-black italic">Quest Admin</h1>
            </div>
        </header>

        <!-- 1. 퀘스트 발송 및 학생 선택 (문제 2 해결) -->
        <section class="bg-white p-8 rounded-[40px] border shadow-sm space-y-6">
            <h2 class="font-black text-xl flex items-center gap-2 text-blue-600">🚀 퀘스트 부여</h2>
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="item-name" placeholder="미션/준비물 이름" class="col-span-2 p-4 bg-slate-50 rounded-2xl outline-none font-bold focus:ring-2 ring-blue-500">
                <input type="datetime-local" id="deadline" class="col-span-2 p-4 bg-slate-50 rounded-2xl outline-none font-bold">
            </div>
            
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-black text-slate-400">대상 학생 선택</span>
                    <button onclick="toggleAllStudents()" class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full">전체 선택/해제</button>
                </div>
                <div id="student-selector" class="flex flex-wrap gap-2">
                    <!-- 학생 명단이 여기에 생성됨 -->
                </div>
            </div>
            <button onclick="sendQuest()" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black text-lg shadow-xl active:scale-95 transition-all">퀘스트 발송하기</button>
        </section>

        <!-- 2. 지참 현황 휠 & 우리반 학생들 (문제 4, 5 해결) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-[32px] border flex flex-col items-center">
                <h3 class="text-xs font-black text-slate-400 mb-4 uppercase">전체 지참 완료율</h3>
                <div class="relative w-32 h-32">
                    <canvas id="mainChart"></canvas>
                    <div id="chart-label" class="absolute inset-0 flex items-center justify-center font-black text-blue-600 text-xl">0%</div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-[32px] border">
                <h3 class="text-xs font-black text-slate-400 mb-4 uppercase">우리반 학생들이 (입장 현황)</h3>
                <div id="presence-list" class="flex flex-wrap gap-2 text-[10px] font-bold">
                    <p class="opacity-20">입장한 학생이 없습니다.</p>
                </div>
            </div>
        </div>

        <!-- 3. 집중 케어 (문제 6 해결) -->
        <section class="bg-red-50 p-6 rounded-[32px] border-2 border-red-100">
            <h3 class="text-red-600 font-black text-xs mb-3 flex items-center gap-2">🚨 집중 케어 대상 (미이행 2회 이상)</h3>
            <div id="care-list" class="flex flex-wrap gap-2 text-[10px] font-bold text-red-500">계산 중...</div>
        </section>

        <!-- 4. 부여한 퀘스트 현황 (문제 1 해결) -->
        <section class="space-y-4">
            <h2 class="font-black text-xl px-2">부여한 퀘스트 현황</h2>
            <div id="quest-dashboard" class="space-y-4"></div>
        </section>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://chaenggime-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 관리 학생 명단 (실제 명단으로 수정 가능)
        const MASTER_STUDENTS = ["김철수", "이영희", "박지민", "최유나", "정재현", "송미소", "한아름"];
        let selectedStudents = [];
        let mainChart;

        window.onload = () => {
            const selector = document.getElementById('student-selector');
            selector.innerHTML = MASTER_STUDENTS.map(s => `
                <button id="sel-${s}" onclick="selectStudent('${s}')" class="px-4 py-2 rounded-xl border-2 border-slate-100 text-[10px] font-black text-slate-400 transition-all">${s}</button>
            `).join('');

            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: [0, 100], backgroundColor: ['#2563eb', '#f1f5f9'], borderWidth: 0 }] },
                options: { cutout: '80%', events: [] }
            });

            syncData();
        };

        function selectStudent(name) {
            const btn = document.getElementById(`sel-${name}`);
            if(selectedStudents.includes(name)) {
                selectedStudents = selectedStudents.filter(s => s !== name);
                btn.className = "px-4 py-2 rounded-xl border-2 border-slate-100 text-[10px] font-black text-slate-400";
            } else {
                selectedStudents.push(name);
                btn.className = "px-4 py-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-blue-600 font-black";
            }
        }

        function toggleAllStudents() {
            if(selectedStudents.length === MASTER_STUDENTS.length) {
                selectedStudents = [];
                MASTER_STUDENTS.forEach(s => document.getElementById(`sel-${s}`).className = "px-4 py-2 rounded-xl border-2 border-slate-100 text-[10px] font-black text-slate-400");
            } else {
                selectedStudents = [...MASTER_STUDENTS];
                MASTER_STUDENTS.forEach(s => document.getElementById(`sel-${s}`).className = "px-4 py-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-blue-600 font-black");
            }
        }

        function sendQuest() {
            const name = document.getElementById('item-name').value;
            const dl = document.getElementById('deadline').value;
            if(!name || !dl || selectedStudents.length === 0) return alert("내용, 마감일, 학생을 모두 선택하세요.");

            db.ref('quests').push({
                item_name: name,
                deadline: dl.replace('T', ' '),
                target: selectedStudents.length === MASTER_STUDENTS.length ? 'all' : 'selected',
                target_list: selectedStudents,
                verified_students: {}
            });
            alert("퀘스트가 발송되었습니다!");
        }

        function syncData() {
            // 입장 현황 (문제 5)
            db.ref('presence').on('value', snap => {
                const active = snap.val() || {};
                const list = Object.keys(active);
                document.getElementById('presence-list').innerHTML = list.map(n => 
                    `<span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full border border-blue-200">● ${n}</span>`
                ).join('') || "접속 중인 학생이 없습니다.";
            });

            // 퀘스트 현황 (문제 1)
            db.ref('quests').on('value', snap => {
                const data = snap.val() || {};
                const keys = Object.keys(data).reverse();
                const container = document.getElementById('quest-dashboard');
                
                let totalNeeded = 0;
                let totalDone = 0;
                const failCounts = {};

                container.innerHTML = keys.map(id => {
                    const q = data[id];
                    const targetList = q.target === 'all' ? MASTER_STUDENTS : q.target_list;
                    const doneList = Object.keys(q.verified_students || {});
                    
                    totalNeeded += targetList.length;
                    totalDone += doneList.length;

                    // 미이행 학생 카운트 (집중 케어용)
                    targetList.forEach(s => {
                        if(!doneList.includes(s)) failCounts[s] = (failCounts[s] || 0) + 1;
                    });

                    return `
                    <div class="bg-white p-6 rounded-[32px] border shadow-sm">
                        <div class="flex justify-between items-center mb-4">
                            <h4 class="font-black text-lg text-slate-800">${q.item_name}</h4>
                            <span class="text-xs font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full">${doneList.length} / ${targetList.length} 완료</span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${targetList.map(s => {
                                const isDone = doneList.includes(s);
                                return `<div class="px-3 py-1.5 rounded-xl text-[10px] font-bold border ${isDone ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-slate-50 text-slate-300 border-slate-100'}">${s}</div>`;
                            }).join('')}
                        </div>
                    </div>`;
                }).join('');

                // 휠 업데이트
                const totalPercent = totalNeeded > 0 ? Math.round((totalDone / totalNeeded) * 100) : 0;
                document.getElementById('chart-label').innerText = totalPercent + "%";
                mainChart.data.datasets[0].data = [totalPercent, 100 - totalPercent];
                mainChart.update();

                // 집중 케어 명단 (문제 6)
                const careStudents = Object.keys(failCounts).filter(s => failCounts[s] >= 2);
                document.getElementById('care-list').innerHTML = careStudents.map(s => 
                    `<span class="bg-white px-3 py-1 rounded-full border border-red-200">⚠️ ${s} (${failCounts[s]}회 누락)</span>`
                ).join('') || "모두가 잘 참여하고 있습니다!";
            });
        }
    </script>
</body>
</html>
