<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챙김이 - 교사용</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-2xl mx-auto space-y-6 pb-24">
        <header><h1 class="text-3xl font-black text-blue-600 italic">Quest Controller</h1></header>

        <!-- 신규 발송 -->
        <section class="bg-white p-8 rounded-[32px] border shadow-sm space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 font-bold">
                <input type="text" id="item-name" placeholder="무엇을 가져와야 하나요?" class="p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-blue-500">
                <input type="datetime-local" id="deadline" class="p-4 bg-slate-50 rounded-2xl border-none outline-none">
            </div>
            
            <div class="space-y-3">
                <div class="flex justify-between items-center px-1">
                    <span class="text-xs font-black text-slate-400">대상 학생 선택</span>
                    <button onclick="toggleAll()" class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full">전체 선택</button>
                </div>
                <div id="student-selector" class="flex flex-wrap gap-2"></div>
            </div>
            
            <button onclick="sendQuest()" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">퀘스트 발송</button>
        </section>

        <!-- 실시간 대시보드 -->
        <section class="space-y-4">
            <h2 class="font-black text-xl px-2">진행 중인 퀘스트 현황</h2>
            <div id="quest-dashboard" class="space-y-4 font-bold"></div>
        </section>
    </div>

    <script>
        // ⚠️ 주의: 아래 주소를 선생님의 Firebase Realtime Database 주소로 반드시 바꾸세요!
        const firebaseConfig = { databaseURL: "https://chaenggime-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const MASTER_LIST = ["김큐티", "이하늘", "박구름", "최바다", "정햇살", "강바람", "윤숲", "조별", "한달", "신샘", "임산", "오내일"];
        let selected = [];

        window.onload = () => {
            const container = document.getElementById('student-selector');
            container.innerHTML = MASTER_LIST.map(s => 
                `<button id="btn-${s}" onclick="toggleStudent('${s}')" class="px-4 py-2 rounded-xl border-2 border-slate-100 text-[10px] font-black text-slate-400 transition-all">${s}</button>`
            ).join('');
            initRealtime();
        };

        function toggleStudent(name) {
            const idx = selected.indexOf(name);
            const btn = document.getElementById(`btn-${name}`);
            if(idx > -1) {
                selected.splice(idx, 1);
                btn.className = "px-4 py-2 rounded-xl border-2 border-slate-100 text-[10px] font-black text-slate-400";
            } else {
                selected.push(name);
                btn.className = "px-4 py-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-blue-600";
            }
        }

        function toggleAll() {
            if(selected.length === MASTER_LIST.length) {
                selected = [];
                MASTER_LIST.forEach(s => document.getElementById(`btn-${s}`).className = "px-4 py-2 rounded-xl border-2 border-slate-100 text-[10px] font-black text-slate-400");
            } else {
                selected = [...MASTER_LIST];
                MASTER_LIST.forEach(s => document.getElementById(`btn-${s}`).className = "px-4 py-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-blue-600");
            }
        }

        function sendQuest() {
            const name = document.getElementById('item-name').value;
            const dl = document.getElementById('deadline').value;
            if(!name || !dl || selected.length === 0) return alert("항목을 모두 채워주세요.");

            db.ref('quests').push({
                item_name: name,
                deadline: dl.replace('T', ' '),
                target_list: selected,
                verified_students: {}
            })
            .then(() => {
                alert("✅ 퀘스트가 발송되었습니다!");
                document.getElementById('item-name').value = '';
            })
            .catch(err => alert("❌ 발송 실패: " + err.message));
        }

        function initRealtime() {
            db.ref('quests').on('value', snap => {
                const data = snap.val() || {};
                const keys = Object.keys(data).reverse();
                const container = document.getElementById('quest-dashboard');
                
                container.innerHTML = keys.map(id => {
                    const q = data[id];
                    const targets = q.target_list || [];
                    const dones = Object.keys(q.verified_students || {});

                    return `
                    <div class="bg-white p-6 rounded-[32px] border shadow-sm">
                        <div class="flex justify-between items-center mb-4">
                            <h4 class="font-black text-lg">${q.item_name}</h4>
                            <span class="text-blue-600 bg-blue-50 px-3 py-1 rounded-full text-xs">${dones.length}/${targets.length}</span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${targets.map(s => `
                                <div class="px-3 py-1.5 rounded-xl text-[10px] border ${dones.includes(s) ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-slate-50 text-slate-300 border-slate-100'}">
                                    ${s}
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                }).join('') || '<p class="text-center py-10 text-slate-300">부여한 퀘스트가 없습니다.</p>';
            });
        }
    </script>
</body>
</html>
