<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챙김이 - 교사용</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-50 p-5">
    <div class="max-w-xl mx-auto space-y-8">
        <header><h1 class="text-2xl font-black text-blue-600">교사용 컨트롤러</h1></header>

        <!-- 퀘스트 발송 -->
        <section class="bg-white p-6 rounded-[32px] border shadow-sm space-y-4">
            <h2 class="font-black">🚀 신규 퀘스트 발송</h2>
            <input type="text" id="item-name" placeholder="준비물 이름" class="w-full p-4 bg-slate-50 rounded-2xl outline-none">
            <input type="datetime-local" id="deadline" class="w-full p-4 bg-slate-50 rounded-2xl outline-none">
            <button onclick="sendQuest()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black">퀘스트 발송</button>
        </section>

        <!-- 입장 학생 현황 섹션 (새로 추가) -->
        <section class="bg-white p-6 rounded-[32px] border shadow-sm">
            <h2 class="font-black mb-4 flex items-center justify-between">
                👥 입장한 학생 현황
                <span id="student-count" class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded-full">0명</span>
            </h2>
            <div id="presence-list" class="flex flex-wrap gap-2 text-xs font-bold text-slate-500 italic">
                입장한 학생이 없습니다.
            </div>
        </section>

        <!-- 퀘스트 현황 리스트 -->
        <section class="space-y-4">
            <h2 class="font-black text-xl">부여한 퀘스트 현황</h2>
            <div id="item-dashboard" class="space-y-4">
                <!-- 여기에 데이터가 실시간으로 뜹니다 -->
            </div>
        </section>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://chaenggime-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. 퀘스트 발송 기능
        function sendQuest() {
            const item = document.getElementById('item-name').value;
            const dl = document.getElementById('deadline').value;
            if(!item || !dl) return alert("내용을 입력하세요.");

            db.ref('quests').push({
                item_name: item,
                deadline: dl.replace('T', ' '),
                verified_students: {}
            });
            document.getElementById('item-name').value = '';
            alert("발송 완료!");
        }

        // 2. 입장 학생 실시간 모니터링
        db.ref('presence').on('value', (snap) => {
            const data = snap.val() || {};
            const names = Object.keys(data);
            document.getElementById('student-count').innerText = names.length + "명";
            document.getElementById('presence-list').innerHTML = names.map(n => 
                `<span class="bg-blue-50 text-blue-700 px-3 py-1 rounded-full border border-blue-100">${n}</span>`
            ).join('');
        });

        // 3. 퀘스트 현황 실시간 업데이트
        db.ref('quests').on('value', (snap) => {
            const quests = snap.val() || {};
            const container = document.getElementById('item-dashboard');
            const ids = Object.keys(quests).reverse();

            if(ids.length === 0) {
                container.innerHTML = `<p class="text-center py-10 opacity-30">내역이 없습니다.</p>`;
                return;
            }

            container.innerHTML = ids.map(id => {
                const q = quests[id];
                const done = Object.keys(q.verified_students || {});
                return `
                <div class="bg-white p-6 rounded-[32px] border shadow-sm">
                    <h4 class="font-black text-lg">${q.item_name}</h4>
                    <p class="text-xs text-slate-400 mb-4">마감: ${q.deadline}</p>
                    <div class="space-y-2">
                        <p class="text-[10px] font-black text-emerald-500">인증 완료 (${done.length}명)</p>
                        <div class="flex flex-wrap gap-2">
                            ${done.map(s => `<span class='bg-emerald-50 text-emerald-700 px-2 py-1 rounded-lg text-[10px] font-bold'>${s}</span>`).join('') || '<span class="text-slate-300">없음</span>'}
                        </div>
                    </div>
                </div>`;
            }).join('');
        });
    </script>
</body>
</html>
