<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>챙김이</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: #f8fafc;
    }
  </style>
</head>
<body>

<div class="max-w-5xl mx-auto p-4">

  <!-- NAV -->
  <div class="flex items-center justify-between mb-6">

    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center">
        <i data-lucide="backpack" class="w-5 h-5 text-white"></i>
      </div>

      <div>
        <h1 class="text-2xl font-bold">챙김이</h1>
        <p class="text-sm text-gray-500">AI 준비물 확인 앱</p>
      </div>
    </div>

    <div class="flex gap-2">

      <button
        id="student-tab"
        class="bg-emerald-500 text-white px-4 py-2 rounded-xl"
      >
        학생
      </button>

      <button
        id="teacher-tab"
        class="bg-white border border-emerald-200 px-4 py-2 rounded-xl"
      >
        교사
      </button>

    </div>
  </div>

  <!-- LOGIN -->
  <div
    id="login-box"
    class="bg-white rounded-2xl border border-emerald-200 p-6 mb-6"
  >

    <h2 class="text-xl font-bold mb-4">학생 로그인</h2>

    <div class="flex gap-2">

      <input
        id="student-name"
        type="text"
        placeholder="이름 입력"
        class="flex-1 border border-gray-300 rounded-xl px-4 py-3"
      />

      <button
        id="login-btn"
        class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 rounded-xl"
      >
        시작
      </button>

    </div>
  </div>

  <!-- STUDENT VIEW -->
  <div id="student-view">

    <div class="bg-white rounded-2xl border border-emerald-200 p-5 mb-6">

      <div class="flex justify-between mb-2">
        <span class="font-medium">오늘의 XP</span>
        <span id="xp-text">0 / 100 XP</span>
      </div>

      <div class="w-full h-3 bg-gray-200 rounded-full overflow-hidden">
        <div
          id="xp-bar"
          class="h-full bg-emerald-500 rounded-full"
          style="width:0%"
        ></div>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-emerald-200 p-5 mb-6">
      <h2 class="text-lg font-bold mb-4">📈 이번 주 나의 챙김 현황</h2>

      <div class="grid grid-cols-3 gap-3 mb-4">

        <div class="bg-emerald-50 rounded-2xl p-4 text-center border border-emerald-100">
          <p class="text-sm text-gray-500 mb-1">완료</p>
          <h3 id="weekly-done" class="text-2xl font-bold text-emerald-600">0</h3>
        </div>

        <div class="bg-yellow-50 rounded-2xl p-4 text-center border border-yellow-100">
          <p class="text-sm text-gray-500 mb-1">진행중</p>
          <h3 id="weekly-progress" class="text-2xl font-bold text-yellow-500">0</h3>
        </div>

        <div class="bg-sky-50 rounded-2xl p-4 text-center border border-sky-100">
          <p class="text-sm text-gray-500 mb-1">성취도</p>
          <h3 id="weekly-rate" class="text-2xl font-bold text-sky-500">0%</h3>
        </div>

      </div>

      <div class="w-full bg-gray-200 h-4 rounded-full overflow-hidden mb-3">
        <div
          id="weekly-bar"
          class="h-full bg-gradient-to-r from-emerald-400 to-emerald-600 rounded-full transition-all duration-500"
          style="width:0%"
        ></div>
      </div>

      <p id="weekly-message" class="text-sm text-gray-600 text-center font-medium">
        오늘도 챙김 완료해보자! ✨
      </p>
    </div>

    <div class="bg-white rounded-2xl border border-emerald-200 p-5">
      <h2 class="text-lg font-bold mb-4">내 준비물</h2>
      <div id="quest-list" class="space-y-3"></div>
    </div>
  </div>

  <!-- TEACHER VIEW -->
  <div id="teacher-view" class="hidden">

    <div class="grid md:grid-cols-3 gap-4 mb-6">

      <div class="bg-white rounded-2xl border border-emerald-200 p-5">
        <p class="text-sm text-gray-500 mb-1">전체 학생</p>
        <h2 id="student-count" class="text-3xl font-bold">0</h2>
      </div>

      <div class="bg-white rounded-2xl border border-emerald-200 p-5">
        <p class="text-sm text-gray-500 mb-1">완료율</p>
        <h2 id="complete-rate" class="text-3xl font-bold text-emerald-600">0%</h2>
      </div>

      <div class="bg-white rounded-2xl border border-emerald-200 p-5">
        <p class="text-sm text-gray-500 mb-1">미완료</p>
        <h2 id="incomplete-count" class="text-3xl font-bold text-red-500">0</h2>
      </div>

    </div>

    <div class="bg-white rounded-2xl border border-emerald-200 p-5 mb-6">

      <h2 class="text-lg font-bold mb-4">준비물 추가</h2>

      <div class="flex gap-2 mb-6">

        <input
          id="teacher-quest-input"
          type="text"
          placeholder="준비물 입력"
          class="flex-1 border border-gray-300 rounded-xl px-4 py-3"
        />

        <button
          id="add-quest-btn"
          class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 rounded-xl"
        >
          추가
        </button>

      </div>

      <h2 class="text-lg font-bold mb-4">학생 현황</h2>

      <div id="teacher-list" class="space-y-3"></div>

    </div>
  </div>
</div>

<!-- TEACHER MODAL -->
<div
  id="teacher-modal"
  class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"
>

  <div class="bg-white rounded-2xl p-6 w-full max-w-sm">

    <h2 class="text-xl font-bold mb-4">교사 인증</h2>

    <input
      id="teacher-password"
      type="password"
      placeholder="비밀번호 입력"
      class="w-full border border-gray-300 rounded-xl px-4 py-3 mb-4"
    />

    <div class="flex gap-2">

      <button
        id="close-modal-btn"
        class="flex-1 py-3 rounded-xl bg-gray-200"
      >
        취소
      </button>

      <button
        id="confirm-password-btn"
        class="flex-1 py-3 rounded-xl bg-emerald-500 text-white"
      >
        확인
      </button>

    </div>
  </div>
</div>

<!-- TOAST -->
<div
  id="toast"
  class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-black text-white px-4 py-2 rounded-xl"
></div>

<script>

const state = {
  currentStudent: localStorage.getItem('student') || '',
  currentView: 'student',
  teacherPassword: '1234',
  quests: JSON.parse(localStorage.getItem('quests') || '[]')
};

const $ = (id) => document.getElementById(id);

function save() {
  localStorage.setItem('quests', JSON.stringify(state.quests));
}

function showToast(message) {

  const toast = $('toast');

  toast.textContent = message;
  toast.classList.remove('hidden');

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    toast.classList.add('hidden');
  }, 2000);
}

function login() {

  const name = $('student-name').value.trim();

  if (!name) {
    showToast('이름을 입력하세요');
    return;
  }

  state.currentStudent = name;

  localStorage.setItem('student', name);

  $('login-box').classList.add('hidden');

  render();

  showToast(`${name} 로그인 완료`);
}

function openTeacherLogin() {
  $('teacher-modal').classList.remove('hidden');
}

function closeTeacherLogin() {
  $('teacher-modal').classList.add('hidden');
}

function checkTeacherPassword() {

  const pw = $('teacher-password').value;

  if (pw !== state.teacherPassword) {
    showToast('비밀번호 오류');
    return;
  }

  $('teacher-password').value = '';

  closeTeacherLogin();

  switchView('teacher');
}

function switchView(view) {

  state.currentView = view;

  $('student-view').classList.toggle('hidden', view !== 'student');
  $('teacher-view').classList.toggle('hidden', view !== 'teacher');

  $('student-tab').className =
    view === 'student'
      ? 'bg-emerald-500 text-white px-4 py-2 rounded-xl'
      : 'bg-white border border-emerald-200 px-4 py-2 rounded-xl';

  $('teacher-tab').className =
    view === 'teacher'
      ? 'bg-emerald-500 text-white px-4 py-2 rounded-xl'
      : 'bg-white border border-emerald-200 px-4 py-2 rounded-xl';
}

function teacherAddQuest() {

  const item = $('teacher-quest-input').value.trim();

  if (!item) {
    showToast('준비물을 입력하세요');
    return;
  }

  const students = [...new Set(state.quests.map(q => q.student))];

  if (state.currentStudent && !students.includes(state.currentStudent)) {
    students.push(state.currentStudent);
  }

  if (!students.length) {
    showToast('등록된 학생이 없습니다');
    return;
  }

  students.forEach(student => {

    const exists = state.quests.some(
      q => q.student === student && q.item === item
    );

    if (!exists) {
      state.quests.push({
        id: Date.now() + Math.random(),
        student,
        item,
        verified: false,
        xp: 0
      });
    }
  });

  save();

  $('teacher-quest-input').value = '';

  render();

  showToast('준비물 추가 완료');
}

let aiModel = null;

async function loadAIModel() {

  if (aiModel) return aiModel;

  showToast('AI 모델 불러오는 중...');

  if (!window.tf) {

    await new Promise((resolve, reject) => {

      const tfScript = document.createElement('script');
      tfScript.src = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0';

      tfScript.onload = resolve;
      tfScript.onerror = reject;

      document.head.appendChild(tfScript);
    });
  }

  if (!window.cocoSsd) {

    await new Promise((resolve, reject) => {

      const cocoScript = document.createElement('script');
      cocoScript.src = 'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3';

      cocoScript.onload = resolve;
      cocoScript.onerror = reject;

      document.head.appendChild(cocoScript);
    });
  }

  aiModel = await cocoSsd.load();

  return aiModel;
}

async function verifyQuest(id) {

  const quest = state.quests.find(q => q.id === id);

  if (!quest) return;

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';

  input.onchange = async (e) => {

    const file = e.target.files[0];

    if (!file) return;

    try {

      showToast('사진 분석 준비중...');

      const model = await loadAIModel();

      const reader = new FileReader();

      reader.onload = () => {

        const img = new Image();

        img.onload = async () => {

          try {

            showToast('AI 분석 중...');

            const predictions = await model.detect(img);

            console.log('AI 결과:', predictions);

            const keywordMap = {
              '공책': ['book'],
              '책': ['book'],
              '필통': ['backpack'],
              '가방': ['backpack'],
              '물병': ['bottle'],
              '텀블러': ['bottle'],
              '색연필': ['pen'],
              '연필': ['pen'],
              '체육복': ['person'],
              '리코더': ['flute']
            };

            const keywords = keywordMap[quest.item] || [];

            const detected = predictions.some(p =>
              keywords.some(k =>
                p.class.toLowerCase().includes(k)
              )
            );

            if (detected || predictions.length > 0) {

              quest.verified = true;
              quest.xp = 20;

              save();
              render();

              showToast('AI 확인 완료! +20XP');

            } else {

              showToast('준비물을 인식하지 못했어요');
            }

          } catch (err) {

            console.error(err);
            showToast('이미지 분석 실패');
          }
        };

        img.onerror = () => {
          console.error('이미지 로딩 실패');
          showToast('이미지를 불러올 수 없어요');
        };

        img.src = reader.result;
      };

      reader.onerror = () => {
        showToast('파일 읽기 실패');
      };

      reader.readAsDataURL(file);

    } catch (err) {

      console.error(err);
      showToast('AI 모델 로딩 실패');
    }
  };

  input.click();
}

function deleteQuest(id) {

  state.quests = state.quests.filter(q => q.id !== id);

  save();

  render();

  showToast('삭제 완료');
}

function getMyQuests() {
  return state.quests.filter(
    q => q.student === state.currentStudent
  );
}

function createQuestCard(quest) {

  return `
    <div class="bg-white rounded-2xl border border-emerald-200 p-4 flex items-center justify-between">

      <div>
        <p class="font-semibold">${quest.item}</p>

        <p class="text-sm ${quest.verified ? 'text-emerald-600' : 'text-gray-500'}">
          ${quest.verified ? '확인 완료' : '미확인'}
        </p>
      </div>

      <div class="flex gap-2">

        ${!quest.verified ? `
          <button
            onclick="verifyQuest(${quest.id})"
            class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2 rounded-xl text-sm"
          >
            AI 확인
          </button>
        ` : ''}

        <button
          onclick="deleteQuest(${quest.id})"
          class="bg-red-100 hover:bg-red-200 text-red-600 px-3 py-2 rounded-xl text-sm"
        >
          삭제
        </button>

      </div>
    </div>
  `;
}

function renderStudentView() {

  const quests = getMyQuests();

  $('quest-list').innerHTML = quests.length
    ? quests.map(createQuestCard).join('')
    : '<p class="text-gray-500 text-sm">준비물이 없습니다</p>';

  const xp = quests.reduce((sum, q) => sum + q.xp, 0);

  $('xp-text').textContent = `${xp} / 100 XP`;

  $('xp-bar').style.width = `${Math.min(xp, 100)}%`;

  const completed = quests.filter(q => q.verified).length;
  const progress = quests.filter(q => !q.verified).length;

  const rate = quests.length
    ? Math.round((completed / quests.length) * 100)
    : 0;

  $('weekly-done').textContent = completed;
  $('weekly-progress').textContent = progress;
  $('weekly-rate').textContent = `${rate}%`;
  $('weekly-bar').style.width = `${rate}%`;

  let message = '오늘도 챙김 완료해보자! ✨';

  if (rate === 100 && quests.length > 0) {
    message = '완벽해요! 이번 주 준비물 마스터 🎉';
  } else if (rate >= 70) {
    message = '조금만 더 힘내면 완벽 달성! 💪';
  } else if (rate >= 30) {
    message = '좋아요! 꾸준히 챙겨보자 😎';
  }

  $('weekly-message').textContent = message;

  lucide.createIcons();
}

function createStudentRow(student) {

  const quests = state.quests.filter(q => q.student === student);

  const done = quests.filter(q => q.verified).length;

  return `
    <div class="bg-emerald-50 rounded-2xl p-4 border border-emerald-200">

      <div class="flex items-center justify-between mb-2">
        <h3 class="font-bold">${student}</h3>

        <span class="text-sm text-emerald-700">
          ${done} / ${quests.length} 완료
        </span>
      </div>

      <div class="flex flex-wrap gap-2">

        ${quests.map(q => `
          <span class="px-3 py-1 rounded-full text-sm ${
            q.verified
              ? 'bg-emerald-200 text-emerald-800'
              : 'bg-red-100 text-red-700'
          }">
            ${q.item}
          </span>
        `).join('')}

      </div>
    </div>
  `;
}

function renderTeacherView() {

  const students = [...new Set(state.quests.map(q => q.student))];

  const total = state.quests.length;

  const completed = state.quests.filter(q => q.verified).length;

  const rate = total
    ? Math.round((completed / total) * 100)
    : 0;

  $('student-count').textContent = students.length;
  $('complete-rate').textContent = `${rate}%`;
  $('incomplete-count').textContent = total - completed;

  $('teacher-list').innerHTML = students.length
    ? students.map(createStudentRow).join('')
    : '<p class="text-gray-500 text-sm">학생 데이터 없음</p>';
}

function render() {

  if (state.currentStudent) {
    $('login-box').classList.add('hidden');
  }

  renderStudentView();
  renderTeacherView();
}

$('login-btn').addEventListener('click', login);
$('student-tab').addEventListener('click', () => switchView('student'));
$('teacher-tab').addEventListener('click', openTeacherLogin);
$('close-modal-btn').addEventListener('click', closeTeacherLogin);
$('confirm-password-btn').addEventListener('click', checkTeacherPassword);
$('add-quest-btn').addEventListener('click', teacherAddQuest);

render();
lucide.createIcons();

</script>

</body>
</html>
